schema_version: "1.1"
name: testing-hollow-suite
description: A TypeScript invoicing service with a React admin screen whose tests mostly cannot fail.
tags: [testing, planted]
runs: 3
expected_outcome: >-
  Publishes a complete run. The collector reports the committed it.only, no coverage thresholds, and
  neither the Testing Library nor the jest-dom lint plugin; the mutation check is not evaluated. The
  model finds the hollow invoice-total tests, the route tests that mock decideRefund and assert only on
  mocks, the untested refund rules on the busiest file, data access never run against a database, and
  component tests that rely on a snapshot, a CSS selector, and a utility class.
context:
  scaffold_script: fixture.sh
execution:
  prompt: /testing-audit
  max_turns: 120
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill]
