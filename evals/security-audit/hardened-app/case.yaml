schema_version: "1.1"
name: security-hardened-app
description: The same invoicing app with each control in place; measures false positives.
tags: [security, clean]
runs: 3
expected_outcome: >-
  Publishes a complete run with no committed secret, local environment files ignored, no eval, and no
  violation on authentication, ownership checks, middleware reliance, request forgery, HTML rendering,
  redirects, token storage, cookies, or the assistant's tools. The act-on list is short or empty and
  invents no problems.
context:
  scaffold_script: fixture.sh
execution:
  prompt: /security-audit
  max_turns: 150
  timeout_seconds: 2400
  allowed_tools: [Read, Glob, Grep, Skill]
