name: Validate playbook

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  RUNNER_TOOL_CACHE: /Users/agents/Agents/Shared/local-ci/toolcache
  AGENT_TOOLSDIRECTORY: /Users/agents/Agents/Shared/local-ci/toolcache

jobs:
  validate:
    name: Validate playbook
    runs-on: [self-hosted, macOS, ARM64, chief-mac-mini, ArchitectPlaybook]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run validator tests
        run: /opt/homebrew/bin/python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Run playbook validator
        run: /opt/homebrew/bin/python3 scripts/validate-playbook.py
