name: Validate playbook

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Validate playbook
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check changed Markdown trailing whitespace
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from sys import exit

          def git(*args):
              return subprocess.check_output(('git', *args), text=True).strip()

          event_name = os.environ.get('GITHUB_EVENT_NAME')
          base_ref = os.environ.get('BASE_REF')
          before_sha = os.environ.get('BEFORE_SHA')

          if event_name == 'pull_request' and base_ref:
              comparison = f'origin/{base_ref}...HEAD'
          elif before_sha and set(before_sha) != {'0'}:
              comparison = f'{before_sha}..HEAD'
          else:
              try:
                  comparison = f'{git("rev-parse", "HEAD^")}..HEAD'
              except subprocess.CalledProcessError:
                  comparison = 'HEAD'

          changed_files = git('diff', '--name-only', '--diff-filter=ACMRT', comparison).splitlines()
          markdown_files = [Path(path) for path in changed_files if path.endswith('.md') and Path(path).is_file()]

          failures = []
          for path in sorted(markdown_files):
              with path.open('rb') as handle:
                  for line_number, line in enumerate(handle, start=1):
                      content = line.rstrip(b'\r\n')
                      if content.endswith((b' ', b'\t')):
                          failures.append(f'{path}:{line_number}')

          if failures:
              print('Markdown trailing whitespace found:')
              print('\n'.join(failures))
              exit(1)
          PY

      - name: Run playbook validator
        run: python scripts/validate-playbook.py
